name: Build CSharp project

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download and Extract Godot Mono
        run: |
          mkdir -p godot
          # Download Godot Mono Linux x86_64 release (adjust version if needed)
          GODOT_VERSION="4.3-stable" # Change to your target version if not 4.3 (e.g., 4.2.1-stable)
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux.x86_64.zip -O godot/godot.zip
          unzip godot/godot.zip -d godot/
          # Clean up zip file
          rm godot/godot.zip

      - name: Make Godot Executable
        run: |
          # Finds the extracted Godot binary dynamically inside the godot folder and makes it executable
          chmod +x godot/Godot_v*_mono_linux.x86_64/Godot_v*_mono_linux.x86_64

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build C# Project
        run: dotnet build --configuration ExportRelease
