name: Build CSharp project

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download Godot 4.7.2 .NET
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip -O godot.zip
          unzip -q godot.zip -d godot
          chmod +x godot/Godot_v4.7.2-stable_mono_linux.x86_64

      - name: Build C# scripts
        run: |
          godot/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --editor --path . --build-solutions --quit
