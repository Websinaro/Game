name: Build CSharp project

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Godot 4.7.2 Mono
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          mkdir -p godot
          wget -O godot/godot.zip "$GODOT_URL"
          unzip -q godot/godot.zip -d godot/
          GODOT_BIN="$(find godot -type f -name 'Godot_v*_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version

      - name: Restore NuGet packages
        run: dotnet restore KeralaOpenWorld.csproj

      - name: Build C# project
        run: dotnet build KeralaOpenWorld.csproj --configuration Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: kerala-open-world-build
          path: .godot/mono/temp/bin/Release/
          if-no-files-found: warn
