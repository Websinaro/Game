name: Build CSharp project

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Godot Mono
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.3-stable"
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"

          mkdir -p godot
          wget -O godot/godot.zip "$GODOT_URL"
          unzip -o godot/godot.zip -d godot/
          rm godot/godot.zip

          GODOT_BIN="$(find godot -type f -name 'Godot_v*_mono_linux.x86_64' -print -quit)"
          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found"
            find godot -maxdepth 3 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --headless --version

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build C# Project
        run: dotnet build --configuration ExportRelease --no-restore
