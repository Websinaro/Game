
name: Build Parashurama Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout original Godot project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709"

      - name: Download Godot 4.7.2
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -O godot.zip

          mkdir godot-bin
          unzip -q godot.zip -d godot-bin

          chmod +x godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64

          sudo ln -s "$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

      - name: Install matching export templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -O templates.tpz

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"
          mkdir templates-temp
          unzip -q templates.tpz -d templates-temp

          cp -a templates-temp/templates/. "$TEMPLATE_DIR/"

      - name: Verify project
        run: |
          test -f project.godot || {
            echo "ERROR: project.godot must be in repository root"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "ERROR: Android export preset is missing"
            exit 1
          }

          grep -q 'name="Android"' export_presets.cfg || {
            echo "ERROR: Export preset must be named Android"
            exit 1
          }

      - name: Configure Godot Android settings
        run: |
          mkdir -p "$HOME/.config/godot"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/temurin-17-jdk-amd64"
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Godot project
        run: |
          godot --headless --editor --path . --import

      - name: Export debug APK
        run: |
          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/Parashurama.apk

          test -s build/Parashurama.apk

          file build/Parashurama.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parashurama-Android-APK
          path: build/Parashurama.apk
          if-no-files-found: error
          retention-days: 14
