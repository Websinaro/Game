
name: Build Parashurama Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    env:
      GODOT_VERSION: 4.7.2
      GODOT_RELEASE: 4.7.2-stable
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      # 1. Checkout project
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 4. Install Android components
      - name: Install Android SDK components
        run: |
          sdkmanager --licenses

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      # 5. Download Godot
      - name: Download Godot
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -O godot.zip

          mkdir -p godot-bin

          unzip -oq godot.zip -d godot-bin

          GODOT_EXEC="$GITHUB_WORKSPACE/godot-bin/Godot_v${GODOT_RELEASE}_linux.x86_64"

          chmod +x "$GODOT_EXEC"

          echo "GODOT_EXEC=$GODOT_EXEC" >> "$GITHUB_ENV"

          "$GODOT_EXEC" --version

      # 6. Download export templates
      - name: Download Godot export templates
        run: |
          wget -q \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz" \
            -O templates.tpz

          mkdir templates-temp

          unzip -q templates.tpz -d templates-temp

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          mkdir -p "$TEMPLATE_DIR"

          cp -a templates-temp/templates/. "$TEMPLATE_DIR/"

          ls -lh "$TEMPLATE_DIR"

      # 7. Verify project
      - name: Verify project
        run: |
          test -f project.godot || {
            echo "project.godot missing"
            exit 1
          }

          test -f export_presets.cfg || {
            echo "export_presets.cfg missing"
            exit 1
          }

          grep -q 'name="Android"' export_presets.cfg || {
            echo "Android preset missing"
            exit 1
          }

          echo "Project verified."

      # 8. Generate temporary debug keystore
      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -validity 10000

          echo "Debug keystore created."

      # 9. Configure Godot
      - name: Configure Godot
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      # 10. Import project
      - name: Import Godot project
        run: |
          "$GODOT_EXEC" \
            --headless \
            --editor \
            --path . \
            --import

      # 11. Export debug APK
      - name: Build Android APK
        run: |
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"

          mkdir -p build

          "$GODOT_EXEC" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/Parashurama.apk

          test -s build/Parashurama.apk

      # 12. Align and sign APK
      - name: Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            build/Parashurama.apk \
            build/Parashurama-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/Parashurama-signed.apk \
            build/Parashurama-aligned.apk

          mv build/Parashurama-signed.apk build/Parashurama.apk

      # 13. Validate APK
      - name: Validate APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.1"

          "$BUILD_TOOLS/apksigner" verify --verbose \
            build/Parashurama.apk

          "$BUILD_TOOLS/zipalign" -c -v 4 \
            build/Parashurama.apk

          unzip -t build/Parashurama.apk

          echo "APK successfully signed and validated."

          ls -lh build/Parashurama.apk

      # 14. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Parashurama-Android-APK
          path: build/Parashurama.apk
          if-no-files-found: error
          retention-days: 14
